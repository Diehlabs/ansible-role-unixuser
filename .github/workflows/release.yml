name: Ansible Release
on:
  workflow_run:
    workflows:
      - 'Ansible CI'
    branches:
      - main
    types:
      - completed

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: Diehlabs/shared-workflows/.github/workflows/github-release.yml@4524aa5e71ac9f5605a465178a7cf243db2940ab # v0.2.3
    secrets: inherit
