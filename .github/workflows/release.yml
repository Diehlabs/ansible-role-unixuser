name: Ansible Release
on:
  workflow_run:
    workflows:
      - 'Ansible CI'
    branches:
      - main
    types:
      - completed

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: Diehlabs/shared-workflows/.github/workflows/github-release.yml@24a1f9f961bd8279d3b0d8058a2969489521ca96 # v0.2.8
    secrets: inherit
